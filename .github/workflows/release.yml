name: Release FrameBoost

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld dpkg-dev fakeroot git curl perl xz-utils libtinfo6 rsync

      - name: Setup Theos toolchain
        run: |
          THEOS="$RUNNER_TEMP/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks" "$RUNNER_TEMP/bin" "$RUNNER_TEMP/sdks"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C "$THEOS/toolchain"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o "$RUNNER_TEMP/sdks.tar.gz"
          tar -xf "$RUNNER_TEMP/sdks.tar.gz" -C "$RUNNER_TEMP/sdks" --strip-components=1
          mv "$RUNNER_TEMP"/sdks/iPhoneOS*.sdk "$THEOS/sdks/"
          curl -fsSL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o "$RUNNER_TEMP/bin/ldid"
          chmod 755 "$RUNNER_TEMP/bin/ldid"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: frameboost-deb
          path: packages/*.deb

  publish-repo:
    runs-on: ubuntu-latest
    needs: build-deb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2

      - name: Download DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: frameboost-deb
          path: ./packages

      - name: Copy DEB into repo directory
        run: |
          mkdir -p repo
          cp -f ./packages/*.deb ./repo/

      - name: Generate Packages index and Pages tree
        run: |
          cd repo
          dpkg-scanpackages -m . /dev/null > Packages
          awk '
            /^Package: com.bluexdeev25432.frameboost$/ { in_package = 1 }
            in_package && /^SileoDepiction:/ { next }
            in_package && /^Depiction:/ {
              print
              print "SileoDepiction: https://bluexdeev25432.github.io/FrameBoost/repo/depiction/frameboost.json"
              next
            }
            in_package && /^$/ { in_package = 0 }
            { print }
          ' Packages > Packages.tmp
          mv Packages.tmp Packages
          perl -0pi -e 's/\n+\z/\n/' Packages
          bzip2 -kf Packages
          cd ..
          mkdir -p pages/repo
          cp -R repo/. pages/repo/
          cp repo/index.html pages/index.html

      - name: Deploy repo to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          destination_dir: ""

      - name: Configure GitHub Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload='{"source":{"branch":"gh-pages","path":"/"}}'
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" --input - <<< "$payload"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages" --input - <<< "$payload"
          fi

  create-release:
    runs-on: ubuntu-latest
    needs: build-deb
    steps:
      - name: Download DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: frameboost-deb
          path: ./packages

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1.0.0
          name: FrameBoost v1.0.0
          files: packages/*.deb
          generate_release_notes: true
          overwrite_files: true
          body: |
            ## FrameBoost 1.0.0

            ### Installation
            Add repo to Sileo:
            `https://bluexdeev25432.github.io/FrameBoost/repo/`

            Or download the .deb below and install manually.

            ### Requirements
            - iOS 15.0 – 16.7
            - Dopamine rootless jailbreak
            - ElleKit or libhooker
            - PreferenceLoader
